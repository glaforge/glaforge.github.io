  <text x="954" y="184" font-size="11" fill="#334155">Runs ONLY after all</text>
  <text x="954" y="199" font-size="11" fill="#334155">5 chapters succeed.</text>
  <text x="954" y="218" font-size="11" fill="#334155">Uploads 5 winners</text>
  <text x="954" y="233" font-size="11" fill="#334155">(MIME-typed .jpg)</text>
  <text x="954" y="256" font-size="10" font-weight="700" fill="#15803d">✓ 0 orphan images</text>

  <line x1="1014" y1="280" x2="1014" y2="312" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="944" y="316" width="140" height="128" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="954" y="338" font-size="13" font-weight="700" fill="#581c87">Save Story</text>
  <text x="954" y="356" font-size="11" font-weight="600" fill="#7e22ce">Cloud Firestore</text>
  <text x="954" y="376" font-size="11" fill="#334155">Title, synopsis,</text>
  <text x="954" y="391" font-size="11" fill="#334155">storyType, 5 chapters</text>
  <text x="954" y="406" font-size="11" fill="#334155">+ gs:// image URIs</text>
  <text x="954" y="426" font-size="10" fill="#475569">Live on Web App</text>
