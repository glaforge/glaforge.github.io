  <text x="704" y="172" font-size="11" font-weight="600" fill="#1d4ed8">gemini-4-hydrogen</text>
  <text x="704" y="190" font-size="11" fill="#334155">Chapter prose + active cast</text>
  <text x="704" y="205" font-size="11" fill="#334155">specs + world motifs +</text>
