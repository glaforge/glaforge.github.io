  <text x="38" y="108" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.06em">STAGE 1 · PLAN</text>

  <rect x="36" y="124" width="168" height="96" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="48" y="146" font-size="13" font-weight="700" fill="#581c87">History Lookback</text>
  <text x="48" y="164" font-size="11" fill="#475569">Reads last 15 stories</text>
  <text x="48" y="179" font-size="11" fill="#475569">from Firestore to avoid</text>
  <text x="48" y="194" font-size="11" fill="#475569">repeating genres &amp; titles.</text>
  <text x="48" y="210" font-size="10" font-weight="600" fill="#7e22ce">+ Random Tone &amp; POV</text>

  <line x1="120" y1="220" x2="120" y2="246" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="36" y="250" width="168" height="172" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="48" y="272" font-size="13" font-weight="700" fill="#1e3a8a">StoryBible (JSON)</text>
  <text x="48" y="290" font-size="11" fill="#1d4ed8" font-weight="600">gemini-4-hydrogen</text>
  <text x="48" y="310" font-size="11" fill="#334155">• 5-Act dramatic arc</text>
  <text x="48" y="326" font-size="11" fill="#334155">• 2–4 cast profiles</text>
  <text x="48" y="342" font-size="11" fill="#334155">• Visual turnaround specs</text>
