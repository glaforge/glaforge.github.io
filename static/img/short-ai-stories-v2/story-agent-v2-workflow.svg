  <text x="268" y="338" font-size="11" font-weight="600" fill="#b45309">gemini-decision-1</text>
  <text x="268" y="358" font-size="11" fill="#334155">ChoiceQuestion + Noul</text>
  <text x="268" y="373" font-size="11" fill="#334155">Scores visualDescription,</text>
