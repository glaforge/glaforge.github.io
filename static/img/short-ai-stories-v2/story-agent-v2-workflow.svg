  <text x="704" y="298" font-size="11" font-weight="600" fill="#0891b2">gemini-nano-banana-2.1</text>
  <text x="704" y="316" font-size="11" fill="#334155">Passes active 1:1 character</text>
  <text x="704" y="331" font-size="11" fill="#334155">sheet images + scene prompt</text>
  <text x="704" y="346" font-size="11" fill="#334155">→ 4× 16:9 panels in RAM</text>
  <text x="704" y="364" font-size="10" fill="#0e7490" font-weight="600">Semaphore(4) image calls</text>

  <line x1="792" y1="374" x2="792" y2="396" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow-amber)"/>

  <rect x="692" y="400" width="200" height="114" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="704" y="421" font-size="13" font-weight="700" fill="#78350f">Multimodal Judge</text>
  <text x="704" y="438" font-size="11" font-weight="600" fill="#b45309">gemini-decision-1</text>
  <text x="704" y="456" font-size="11" fill="#334155">ChoiceQuestion (best_candidate)</text>
  <text x="704" y="471" font-size="11" fill="#334155">+ NoulQuestion (has_text_i)</text>
  <text x="704" y="486" font-size="11" fill="#334155">vs. cast sheets &amp; prose</text>
  <text x="704" y="504" font-size="10" font-weight="600" fill="#b45309">→ 1 winning panel in RAM</text>

  <!-- Arrow 4 -> 5 -->
