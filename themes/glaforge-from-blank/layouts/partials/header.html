<header>
	<div>
		{{ if .IsHome }}<h1 class="site-title"><a href="{{ .Site.BaseURL }}">❯ {{ .Site.Title }}</a></h1>{{ else }}<a href="{{ .Site.BaseURL }}">❯ {{ .Site.Title }}</a>{{ end }}
		{{ with .Site.Menus.main }}
		<nav>
			<ul>
				{{ range . }}
				<li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
				{{ end }}
			</ul>
		</nav>
		{{ end }}
	</div>
</header>
