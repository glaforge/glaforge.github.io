  <text x="492" y="218" font-size="11" fill="#334155">• Prior written chapters</text>
  <text x="492" y="234" font-size="11" fill="#334155">• Act beat + visual cue</text>
  <text x="492" y="250" font-size="11" fill="#334155">• 350–550 words/chapter</text>
  <text x="492" y="274" font-size="10" fill="#475569">Maintains continuity &amp;</text>
  <text x="492" y="286" font-size="10" fill="#475569">planted clues</text>

  <line x1="560" y1="294" x2="560" y2="322" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="480" y="326" width="160" height="148" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="492" y="348" font-size="13" font-weight="700" fill="#1e3a8a">Literary Editor Pass</text>
  <text x="492" y="366" font-size="11" font-weight="600" fill="#1d4ed8">gemini-4-hydrogen</text>
  <text x="492" y="386" font-size="11" fill="#334155">Polishes full manuscript:</text>
  <text x="492" y="404" font-size="11" fill="#334155">• Varied chapter openings</text>
  <text x="492" y="420" font-size="11" fill="#334155">• Cuts AI clichés</text>
  <text x="492" y="436" font-size="11" fill="#334155">• Sharpens dialogue</text>
  <text x="492" y="452" font-size="11" fill="#334155">• Resonant Ch. 5 ending</text>

