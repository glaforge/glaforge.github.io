  <!-- Background -->
  <rect width="1120" height="560" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Legend -->
  <text x="28" y="36" font-size="18" font-weight="700" fill="#0f172a">Story Generator Agent — 5-Stage Agentic Workflow</text>
  <text x="28" y="56" font-size="12" fill="#475569">Java 25 · google-genai SDK 2.4.0 · Gemini 4 Hydrogen + Nano Banana 2.1 + Gemini Decision 1</text>

  <!-- Legend pills -->
  <g transform="translate(650, 22)" font-size="11" font-weight="600">
    <rect x="0" y="0" width="82" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
    <circle cx="14" cy="12" r="4" fill="#2563eb"/>
    <text x="24" y="16" fill="#1e3a8a">Textual</text>

    <rect x="92" y="0" width="94" height="24" rx="12" fill="#ecfeff" stroke="#06b6d4"/>
    <circle cx="106" cy="12" r="4" fill="#0891b2"/>
    <text x="116" y="16" fill="#164e63">Graphical</text>

    <rect x="196" y="0" width="122" height="24" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
    <circle cx="210" cy="12" r="4" fill="#d97706"/>
