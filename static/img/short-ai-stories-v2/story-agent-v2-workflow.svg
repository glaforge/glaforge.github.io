  <text x="48" y="374" font-size="11" fill="#334155">• Scene roster per act</text>
  <text x="48" y="394" font-size="10" fill="#475569">Enforced via responseSchema</text>
  <text x="48" y="408" font-size="10" fill="#475569">+ cliché name guardrails</text>

  <rect x="36" y="438" width="168" height="74" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="48" y="458" font-size="11" font-weight="700" fill="#334155">Shared House Style</text>
  <text x="48" y="474" font-size="10" fill="#475569">GRITTY_NOIR_INK_STYLE</text>
  <text x="48" y="489" font-size="10" fill="#475569">Sumi-brush, halftone,</text>
  <text x="48" y="503" font-size="10" fill="#475569">prussian blue / cyan / amber</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="216" y1="305" x2="240" y2="305" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

