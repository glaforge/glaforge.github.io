  <line x1="792" y1="234" x2="792" y2="256" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="692" y="260" width="200" height="114" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
