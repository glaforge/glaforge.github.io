  <text x="268" y="164" font-size="11" font-weight="600" fill="#0891b2">gemini-nano-banana-2.1</text>
  <text x="268" y="184" font-size="11" fill="#334155">• 1:1 turnaround + portrait</text>
  <text x="268" y="200" font-size="11" fill="#334155">• 2 candidates in parallel</text>
  <text x="268" y="216" font-size="11" fill="#334155">• Plain slate backdrop</text>
